name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          $parts = $v.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $version = ($parts[0..3] -join '.')
          Write-Host "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build ClipboardUnlocker.exe
        shell: pwsh
        run: .\Build-Exe.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipboardUnlocker.exe
          generate_release_notes: true
